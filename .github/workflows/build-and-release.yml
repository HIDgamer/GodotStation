# GitHub Actions - Auto Build & Release for GodotStation
name: Build and Release GodotStation

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
  workflow_dispatch:

env:
  GODOT_VERSION: 4.6
  EXPORT_NAME: GodotStation

jobs:
  build-windows:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Build
        run: |
          mkdir -p build/windows
          godot --headless --verbose --export-release "Windows Desktop" build/windows/$EXPORT_NAME.exe
          echo "${{ github.ref_name }}" > build/windows/version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows/

  build-linux:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Build
        run: |
          mkdir -p build/linux
          godot --headless --verbose --export-release "Linux/X11" build/linux/$EXPORT_NAME.x86_64
          echo "${{ github.ref_name }}" > build/linux/version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/linux/

  create-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: windows-files
      
      - name: Download Linux
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: linux-files
      
      - name: Zip and Prepare Manifest
        run: |
          # 1. Create the Zips
          cd windows-files && zip -r ../GodotStation-Windows.zip . && cd ..
          cd linux-files && zip -r ../GodotStation-Linux.zip . && cd ..
          
          # 2. Get Sizes (The -b flag ensures bytes)
          WIN_SIZE=$(du -b GodotStation-Windows.zip | cut -f1)
          LIN_SIZE=$(du -b GodotStation-Linux.zip | cut -f1)
          VERSION="${{ github.ref_name }}"
          
          # 3. Generate Manifest
          cat > version-manifest.json << EOF
          {
            "version": "${VERSION}",
            "build_date": "$(date -u +%Y-%m-%d_%H:%M:%S)",
            "platforms": {
              "windows": {
                "url": "https://github.com/${{ github.repository }}/releases/download/${VERSION}/GodotStation-Windows.zip",
                "size": ${WIN_SIZE}
              },
              "linux": {
                "url": "https://github.com/${{ github.repository }}/releases/download/${VERSION}/GodotStation-Linux.zip",
                "size": ${LIN_SIZE}
              }
            }
          }
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            GodotStation-Windows.zip
            GodotStation-Linux.zip
            version-manifest.json
          body: "Release ${{ github.ref_name }} built from ${{ github.sha }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-manifest:
    needs: create-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Deploy to Oracle
        uses: appleboy/scp-action@master
        with:
          host: 150.136.90.194
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: "version-manifest.json"
          target: "/var/www/godotstation/updates/"
