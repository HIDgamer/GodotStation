name: Build and Release GodotStation

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
  workflow_dispatch:

env:
  GODOT_VERSION: 4.6
  EXPORT_NAME: GodotStation

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [windows, linux]
    container:
      image: barichello/godot-ci:4.6-mono
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Godot Mono Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          wget https://downloads.tuxfamily.org/godotengine/${GODOT_VERSION}/mono/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz
          tar -xf Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz -C ~/.local/share/godot/export_templates
          rm Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz

      - name: Build Godot
        run: |
          mkdir -p build/${{ matrix.platform }}

          if [ "${{ matrix.platform }}" = "windows" ]; then
            PRESET_NAME="Windows Desktop"
            OUTPUT_FILE="build/windows/$EXPORT_NAME.exe"
          else
            PRESET_NAME="Linux/X11"
            OUTPUT_FILE="build/linux/$EXPORT_NAME.x86_64"
          fi

          echo "Building $PRESET_NAME -> $OUTPUT_FILE"
          godot --headless --verbose --export-release "$PRESET_NAME" "$OUTPUT_FILE"

          # Save version.txt
          echo "${GITHUB_REF_NAME}" > $(dirname "$OUTPUT_FILE")/version.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: build/${{ matrix.platform }}/

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: windows-files

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: linux-files

      - name: Zip builds and create manifest
        run: |
          cd windows-files && zip -r ../GodotStation-Windows.zip . && cd ..
          cd linux-files && zip -r ../GodotStation-Linux.zip . && cd ..

          WIN_SIZE=$(du -b GodotStation-Windows.zip | cut -f1)
          LIN_SIZE=$(du -b GodotStation-Linux.zip | cut -f1)
          VERSION="${GITHUB_REF_NAME}"

          echo '{"version":"'"$VERSION"'","build_date":"'"$(date -u +%Y-%m-%d_%H:%M:%S)"'","platforms":{"windows":{"url":"https://github.com/'"$GITHUB_REPOSITORY"'/releases/download/'"$VERSION"'/GodotStation-Windows.zip","size":'"$WIN_SIZE"'},"linux":{"url":"https://github.com/'"$GITHUB_REPOSITORY"'/releases/download/'"$VERSION"'/GodotStation-Linux.zip","size":'"$LIN_SIZE"'}}}' > version-manifest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            GodotStation-Windows.zip
            GodotStation-Linux.zip
            version-manifest.json
          body: "Release ${GITHUB_REF_NAME} built from ${GITHUB_SHA}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-manifest:
    needs: create-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Deploy manifest to server
        uses: appleboy/scp-action@master
        with:
          host: 150.136.90.194
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: "version-manifest.json"
          target: "/var/www/godotstation/updates/"
