name: Build and Release GodotStation

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
    branches:
      - main
  workflow_dispatch:

env:
  GODOT_VERSION: 4.6.1
  EXPORT_NAME: GodotStation

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            preset: "Windows Desktop Client"
            output: "GodotStation.exe"
            artifact: windows-build
          - platform: linux
            preset: "Linux Client"
            output: "GodotStation.x86_64"
            artifact: linux-build
          - platform: server
            preset: "Linux Dedicated Server"
            output: "GodotStationServer.x86_64"
            artifact: server-build

    container:
      image: barichello/godot-ci:mono-4.6.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache NuGet packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}

      - name: Dotnet Restore
        run: dotnet restore

      - name: Dotnet Build
        run: dotnet build --no-restore

      - name: Install Godot Mono Export Templates
        run: |
          mkdir -p /github/home/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
          wget --quiet --tries=3 --retry-connrefused \
            https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz
          mv templates/* /github/home/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono/
          rm Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz

      - name: Build ${{ matrix.platform }}
        run: |
          mkdir -p build/${{ matrix.platform }}
          OUTPUT="build/${{ matrix.platform }}/${{ matrix.output }}"
          godot --headless --verbose --export-release "${{ matrix.preset }}" "$OUTPUT"

          if [ ! -f "$OUTPUT" ]; then
            echo "ERROR: Export did not produce: $OUTPUT"
            ls -la build/${{ matrix.platform }}/
            exit 1
          fi

          chmod +x "$OUTPUT" || true
          echo "${GITHUB_REF_NAME}" > build/${{ matrix.platform }}/version.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/${{ matrix.platform }}/

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    outputs:
      tag: ${{ github.ref_name }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify server artifact contents
        run: |
          echo "=== Server build contents ==="
          ls -la artifacts/server-build/
          if [ ! -f "artifacts/server-build/GodotStationServer.x86_64" ]; then
            echo "ERROR: Server binary missing from artifact."
            exit 1
          fi

      - name: Zip builds and create manifest
        run: |
          cd artifacts/windows-build && zip -r ../../GodotStation-Windows.zip . && cd ../..
          cd artifacts/linux-build   && zip -r ../../GodotStation-Linux.zip . && cd ../..
          cd artifacts/server-build  && zip -r ../../GodotStation-Server-Linux.zip . && cd ../..

          WIN_SIZE=$(stat -c%s GodotStation-Windows.zip)
          LIN_SIZE=$(stat -c%s GodotStation-Linux.zip)
          SRV_SIZE=$(stat -c%s GodotStation-Server-Linux.zip)
          VERSION="${GITHUB_REF_NAME#v}"

          cat > version-manifest.json << MANIFEST
          {
            "version": "$VERSION",
            "build_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows": { "url": "https://github.com/$GITHUB_REPOSITORY/releases/download/${GITHUB_REF_NAME}/GodotStation-Windows.zip", "size": $WIN_SIZE },
              "linux":   { "url": "https://github.com/$GITHUB_REPOSITORY/releases/download/${GITHUB_REF_NAME}/GodotStation-Linux.zip", "size": $LIN_SIZE },
              "server":  { "url": "https://github.com/$GITHUB_REPOSITORY/releases/download/${GITHUB_REF_NAME}/GodotStation-Server-Linux.zip", "size": $SRV_SIZE }
            }
          }
          MANIFEST

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GodotStation-Windows.zip
            GodotStation-Linux.zip
            GodotStation-Server-Linux.zip
            version-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: version-manifest
          path: version-manifest.json

  deploy-manifest-to-game:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Download manifest artifact
        uses: actions/download-artifact@v4
        with:
          name: version-manifest
          path: .

      - name: Deploy manifest to GAME server (Autoupdater)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.GAME_IP }}
          username: ubuntu
          key: ${{ secrets.GAME_SSH_KEY }}
          port: 22
          source: "version-manifest.json"
          target: "/var/www/godotstation/updates/"

  deploy-dedicated-server-to-oracle:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ORACLE_IP }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          script: |
            set -e
            TAG="${{ needs.create-release.outputs.tag }}"
            REPO="${{ github.repository }}"
            DEPLOY_DIR="/home/ubuntu/godotstation"
            BACKUP_DIR="$DEPLOY_DIR/backups"
            PANEL_URL="http://localhost:8087"
            BINARY_IN_ZIP="GodotStationServer.x86_64"
            PCK_IN_ZIP="GodotStationServer.pck"
            DATA_DIR_IN_ZIP="data_GodotStation_linuxbsd_x86_64"
            BINARY_NAME="GodotStationServer.x86_64"
            PCK_NAME="GodotStationServer.pck"
            ASSET_URL="https://github.com/${REPO}/releases/download/${TAG}/GodotStation-Server-Linux.zip"

            mkdir -p "$BACKUP_DIR"

            echo "=== Stopping server (deploying tag: $TAG) ==="
            curl -sf -X POST \
              -H "Content-Type: application/json" \
              -d "{\"password\":\"${{ secrets.PANEL_PASSWORD }}\"}" \
              "$PANEL_URL/api/login" -c /tmp/gs_deploy.txt || true
            curl -sf -X POST "$PANEL_URL/api/stop" -b /tmp/gs_deploy.txt || true
            sleep 3

            if [ -f "$DEPLOY_DIR/$BINARY_NAME" ]; then
              echo "=== Backing up current build ==="
              cp "$DEPLOY_DIR/$BINARY_NAME" "$BACKUP_DIR/$BINARY_NAME.bak"
              cp "$DEPLOY_DIR/$PCK_NAME"    "$BACKUP_DIR/$PCK_NAME.bak" 2>/dev/null || true
            fi

            echo "=== Removing old binaries ==="
            rm -fv "$DEPLOY_DIR/$BINARY_NAME"
            rm -fv "$DEPLOY_DIR/$PCK_NAME"
            rm -fv "$DEPLOY_DIR/GodotStation.x86_64"
            rm -fv "$DEPLOY_DIR/GodotStation.pck"
            rm -fv "$DEPLOY_DIR/GodotStation.server"

            echo "=== Downloading $ASSET_URL ==="
            rm -rf /tmp/gs_extract /tmp/server_update.zip
            wget -q "$ASSET_URL" -O /tmp/server_update.zip
            unzip -q -o /tmp/server_update.zip -d /tmp/gs_extract

            echo "=== Zip contents ==="
            ls -la /tmp/gs_extract/

            if [ ! -f "/tmp/gs_extract/$BINARY_IN_ZIP" ]; then
              echo "ERROR: '$BINARY_IN_ZIP' not found. Restoring backup."
              [ -f "$BACKUP_DIR/$BINARY_NAME.bak" ] && cp "$BACKUP_DIR/$BINARY_NAME.bak" "$DEPLOY_DIR/$BINARY_NAME"
              [ -f "$BACKUP_DIR/$PCK_NAME.bak"    ] && cp "$BACKUP_DIR/$PCK_NAME.bak"    "$DEPLOY_DIR/$PCK_NAME"
              curl -sf -X POST "$PANEL_URL/api/start" -b /tmp/gs_deploy.txt || true
              rm -rf /tmp/gs_extract /tmp/server_update.zip /tmp/gs_deploy.txt
              exit 1
            fi

            if [ ! -f "/tmp/gs_extract/$PCK_IN_ZIP" ]; then
              echo "ERROR: '$PCK_IN_ZIP' not found. Restoring backup."
              [ -f "$BACKUP_DIR/$BINARY_NAME.bak" ] && cp "$BACKUP_DIR/$BINARY_NAME.bak" "$DEPLOY_DIR/$BINARY_NAME"
              [ -f "$BACKUP_DIR/$PCK_NAME.bak"    ] && cp "$BACKUP_DIR/$PCK_NAME.bak"    "$DEPLOY_DIR/$PCK_NAME"
              curl -sf -X POST "$PANEL_URL/api/start" -b /tmp/gs_deploy.txt || true
              rm -rf /tmp/gs_extract /tmp/server_update.zip /tmp/gs_deploy.txt
              exit 1
            fi

            echo "=== Installing new build ==="
            cp "/tmp/gs_extract/$BINARY_IN_ZIP" "$DEPLOY_DIR/$BINARY_NAME"
            cp "/tmp/gs_extract/$PCK_IN_ZIP"    "$DEPLOY_DIR/$PCK_NAME"
            chmod +x "$DEPLOY_DIR/$BINARY_NAME"

            if [ -d "/tmp/gs_extract/$DATA_DIR_IN_ZIP" ]; then
              echo "=== Installing Mono runtime data folder ==="
              rm -rf "$DEPLOY_DIR/$DATA_DIR_IN_ZIP"
              cp -r "/tmp/gs_extract/$DATA_DIR_IN_ZIP" "$DEPLOY_DIR/"
            fi

            echo "=== Starting server ==="
            curl -sf -X POST "$PANEL_URL/api/start" -b /tmp/gs_deploy.txt || true

            echo "$TAG" > "$DEPLOY_DIR/version.txt"
            rm -rf /tmp/gs_extract /tmp/server_update.zip /tmp/gs_deploy.txt
            echo "=== Deployment complete: $TAG ==="