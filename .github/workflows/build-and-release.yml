# GitHub Actions - Auto Build & Release for GodotStation (C# / Mono)
name: Build and Release GodotStation

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
  workflow_dispatch:

env:
  GODOT_VERSION: 4.6
  EXPORT_NAME: GodotStation

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [windows, linux]
    
    container:
      image: barichello/godot-ci:mono-4.6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache NuGet packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Dotnet Restore
        run: dotnet restore

      - name: Install Godot Mono Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
          wget https://downloads.tuxfamily.org/godotengine/${GODOT_VERSION}/mono/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz
          unzip Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono/
          rm Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz

      - name: Build Godot
        run: |
          mkdir -p build/${{ matrix.platform }}
          
          if [ "${{ matrix.platform }}" = "windows" ]; then
            PRESET_NAME="Windows Desktop"
            OUTPUT_FILE="build/windows/$EXPORT_NAME.exe"
          else
            PRESET_NAME="Linux/X11"
            OUTPUT_FILE="build/linux/$EXPORT_NAME.x86_64"
          fi

          echo "Building $PRESET_NAME -> $OUTPUT_FILE"
          godot --headless --verbose --export-release "$PRESET_NAME" "$OUTPUT_FILE"
          
          # Save version.txt inside the build folder
          echo "${GITHUB_REF_NAME}" > $(dirname "$OUTPUT_FILE")/version.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: build/${{ matrix.platform }}/

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip builds and create manifest
        run: |
          # Process Windows
          cd artifacts/windows-build && zip -r ../../GodotStation-Windows.zip . && cd ../..
          # Process Linux
          cd artifacts/linux-build && zip -r ../../GodotStation-Linux.zip . && cd ../..

          # Calculate sizes for manifest
          WIN_SIZE=$(stat -c%s GodotStation-Windows.zip)
          LIN_SIZE=$(stat -c%s GodotStation-Linux.zip)
          VERSION="${GITHUB_REF_NAME}"

          # Create JSON Manifest
          echo "{\"version\":\"$VERSION\",\"build_date\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"platforms\":{\"windows\":{\"url\":\"https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/GodotStation-Windows.zip\",\"size\":$WIN_SIZE},\"linux\":{\"url\":\"https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/GodotStation-Linux.zip\",\"size\":$LIN_SIZE}}}" > version-manifest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GodotStation-Windows.zip
            GodotStation-Linux.zip
            version-manifest.json
          body: "Release ${GITHUB_REF_NAME} built from ${GITHUB_SHA}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-manifest:
    needs: create-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Deploy manifest to server
        uses: appleboy/scp-action@master
        with:
          host: 150.136.90.194
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: "version-manifest.json"
          target: "/var/www/godotstation/updates/"
