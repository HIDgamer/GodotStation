name: Build and Release GodotStation

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
    branches:
      - main
  workflow_dispatch:

env:
  GODOT_VERSION: 4.6
  EXPORT_NAME: GodotStation
  UPDATE_SERVER: "132.145.130.83"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [windows, linux]
    
    container:
      image: barichello/godot-ci:mono-4.6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache NuGet packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}

      - name: Dotnet Restore
        run: dotnet restore

      - name: Install Godot Mono Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
          wget --quiet --tries=3 --retry-connrefused https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono/
          rm Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz

      - name: Build Godot Project
        run: |
          mkdir -p build/${{ matrix.platform }}
          
          if [ "${{ matrix.platform }}" = "windows" ]; then
            PRESET_NAME="Windows Desktop"
            OUTPUT_FILE="build/windows/$EXPORT_NAME.exe"
          else
            PRESET_NAME="Linux/X11"
            OUTPUT_FILE="build/linux/$EXPORT_NAME.x86_64"
          fi

          echo "Building $PRESET_NAME -> $OUTPUT_FILE"
          godot --headless --verbose --export-release "$PRESET_NAME" "$OUTPUT_FILE"
          
          if [ "${{ matrix.platform }}" = "linux" ]; then
            chmod +x "$OUTPUT_FILE"
          fi
          
          echo "${GITHUB_REF_NAME}" > $(dirname "$OUTPUT_FILE")/version.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: build/${{ matrix.platform }}/

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip builds and create manifest
        run: |
          cd artifacts/windows-build && zip -r ../../GodotStation-Windows.zip . && cd ../..
          cd artifacts/linux-build && zip -r ../../GodotStation-Linux.zip . && cd ../..

          WIN_SIZE=$(stat -c%s GodotStation-Windows.zip)
          LIN_SIZE=$(stat -c%s GodotStation-Linux.zip)
          VERSION="${GITHUB_REF_NAME#v}" 

          cat > version-manifest.json << EOF
          {
            "version": "$VERSION",
            "build_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows": {
                "url": "https://github.com/$GITHUB_REPOSITORY/releases/download/${GITHUB_REF_NAME}/GodotStation-Windows.zip",
                "size": $WIN_SIZE
              },
              "linux": {
                "url": "https://github.com/$GITHUB_REPOSITORY/releases/download/${GITHUB_REF_NAME}/GodotStation-Linux.zip",
                "size": $LIN_SIZE
              }
            }
          }
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GodotStation-Windows.zip
            GodotStation-Linux.zip
            version-manifest.json
          body: |
            ## GodotStation ${GITHUB_REF_NAME}
            **Release Date:** $(date -u +%Y-%m-%d)
            Built from commit ${GITHUB_SHA}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: version-manifest
          path: version-manifest.json

  deploy-manifest:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Download manifest artifact
        uses: actions/download-artifact@v4
        with:
          name: version-manifest
          path: .

      - name: Deploy manifest to Oracle server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.ORACLE_IP }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          source: "version-manifest.json"
          target: "/var/www/godotstation/updates/"
          strip_components: 0

      - name: Verify deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ORACLE_IP }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            echo "Verifying deployment at /var/www/godotstation/updates/"
            ls -lh /var/www/godotstation/updates/version-manifest.json
            cat /var/www/godotstation/updates/version-manifest.json